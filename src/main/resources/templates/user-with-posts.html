<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org" lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>User Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/post-feed.css">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --dark-bg: #1a1d29;
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            --card-hover-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        [data-theme="dark"] {
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            --card-hover-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
        }

        * {
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        [data-theme="dark"] body {
            background: linear-gradient(135deg, #1a1d29 0%, #2d3142 100%);
            color: #e0e0e0;
        }

        .navbar-modern {
            background: var(--primary-gradient) !important;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            padding: 1.2rem 0;
        }

        .navbar-modern .navbar-brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: white !important;
            letter-spacing: 0.5px;
        }

        .user-info-header {
            color: white;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .user-info-header i {
            font-size: 1.2rem;
        }

        .role-badge {
            display: inline-block;
            padding: 0.35rem 0.85rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            margin-left: 0.5rem;
        }

        .sidebar {
            background: white;
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: var(--card-shadow);
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        [data-theme="dark"] .sidebar {
            background: #2d3142;
            color: #e0e0e0;
        }

        .sidebar .nav-link {
            padding: 0.75rem 1.25rem;
            margin-bottom: 0.5rem;
            border-radius: 10px;
            color: #495057;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transition: all 0.3s ease;
        }

        [data-theme="dark"] .sidebar .nav-link {
            color: #b0b0b0;
        }

        .sidebar .nav-link:hover {
            background: var(--primary-gradient);
            color: white;
            transform: translateX(5px);
        }

        .sidebar .nav-link.active {
            background: var(--primary-gradient);
            color: white;
        }

        .sidebar .nav-link i {
            font-size: 1.1rem;
        }

        .main-content {
            background: white;
            border-radius: 15px;
            padding: 2.5rem;
            box-shadow: var(--card-shadow);
            margin-bottom: 2rem;
        }

        [data-theme="dark"] .main-content {
            background: #2d3142;
            color: #e0e0e0;
        }

        .page-title {
            font-size: 2.5rem;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 2rem;
        }

        .info-card {
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            border: none;
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
        }

        [data-theme="dark"] .info-card {
            background: linear-gradient(135deg, #667eea25 0%, #764ba225 100%);
        }

        .info-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--card-hover-shadow);
        }

        .info-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #6c757d;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        [data-theme="dark"] .info-label {
            color: #9ca3af;
        }

        .info-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #212529;
        }

        [data-theme="dark"] .info-value {
            color: #e0e0e0;
        }

        .info-value.role {
            display: inline-block;
            padding: 0.5rem 1.25rem;
            background: var(--primary-gradient);
            color: white;
            border-radius: 25px;
            font-size: 1rem;
            margin-top: 0.5rem;
        }

        .btn-modern {
            border-radius: 10px;
            padding: 0.6rem 1.5rem;
            font-weight: 600;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-logout {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
        }

        .btn-logout:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.5);
            color: white;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .stat-item {
            text-align: center;
            padding: 1.5rem;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        [data-theme="dark"] .stat-item {
            background: #2d3142;
            color: #e0e0e0;
        }

        .theme-toggle {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-left: 1rem;
        }

        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        .theme-toggle i {
            font-size: 1.3rem;
        }

        .stat-icon {
            font-size: 2.5rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        @media (max-width: 768px) {
            .sidebar {
                margin-bottom: 2rem;
                position: relative;
                top: 0;
            }

            .page-title {
                font-size: 2rem;
            }

            .main-content {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Modern Navbar -->
    <nav class="navbar navbar-modern">
        <div class="container-fluid px-4">
            <div class="d-flex align-items-center">
                <i class="bi bi-person-circle text-white me-2" style="font-size: 1.8rem;"></i>
                <div class="user-info-header">
                    <span id="userEmail"><!-- подгружаем js --></span>
                    <span class="role-badge" id="userRoles"><!-- подгружаем js --></span>
                </div>
            </div>
            <div class="d-flex align-items-center gap-3">
                <button id="themeToggle" class="theme-toggle" onclick="toggleTheme()" title="Switch to Dark Mode">
                    <i class="bi bi-moon-fill"></i>
                </button>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-logout btn-modern">
                        <i class="bi bi-box-arrow-right me-2"></i>Logout
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 py-4">
        <div class="row">
            <!-- Sidebar Navigation -->
            <div class="col-lg-3 col-md-4 mb-4">
                <div class="sidebar">
                    <div class="d-flex flex-column">
                        <a href="/user" class="nav-link active">
                            <i class="bi bi-house-door"></i>
                            <span>Home</span>
                        </a>
                        <a th:if="${user.roles.?[name == 'ROLE_ADMIN'].size() > 0}"
                           href="/admin" class="nav-link">
                            <i class="bi bi-shield-lock"></i>
                            <span>Admin Panel</span>
                        </a>
                    </div>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-lg-9 col-md-8">
                <div class="main-content">
                    <h1 class="page-title">
                        <i class="bi bi-person-badge me-2"></i>User Dashboard
                    </h1>

                    <!-- User Information Cards -->
                    <div class="row" id="userInfoCards">
                        <!-- подгружаем js -->
                    </div>

                    <!-- Stats Grid -->
                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-icon">
                                <i class="bi bi-person-check"></i>
                            </div>
                            <div class="info-label">Status</div>
                            <div class="info-value" style="font-size: 1rem; color: #28a745;">
                                <i class="bi bi-check-circle me-1"></i>Active
                            </div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-icon">
                                <i class="bi bi-shield-check"></i>
                            </div>
                            <div class="info-label">Security</div>
                            <div class="info-value" style="font-size: 1rem; color: #17a2b8;">
                                <i class="bi bi-lock me-1"></i>Protected
                            </div>
                        </div>
                    </div>

                    <!-- Post Feed Section -->
                    <div class="post-feed-container">
                        <!-- Create Post Section -->
                        <div class="create-post-card">
                            <h5 class="mb-3">
                                <i class="bi bi-pencil-square me-2"></i>Create a Post
                            </h5>
                            <textarea 
                                id="createPostTextarea" 
                                class="create-post-textarea" 
                                placeholder="What's on your mind?"
                                maxlength="1000"></textarea>
                            <div class="create-post-actions">
                                <span id="charCounter" class="char-counter">0/1000</span>
                                <button id="createPostBtn" class="btn-create-post" disabled>
                                    <i class="bi bi-send me-2"></i>Post
                                </button>
                            </div>
                        </div>

                        <!-- Posts Container -->
                        <div id="postsContainer">
                            <!-- Posts will be loaded here dynamically -->
                            <div class="loading-spinner">
                                <i class="bi bi-arrow-clockwise"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
            crossorigin="anonymous"></script>
    <script src="/theme.js"></script>
    <script src="/user.js"></script>
    <script src="/post-feed.js"></script>
</body>
</html>
