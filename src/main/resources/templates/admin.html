<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Админ-панель</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            background-color: #fff;
            color: #222;
            font-family: 'Arial', sans-serif;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #ddd;
            margin-bottom: 20px;
        }

        .admin-header h2 {
            font-size: 22px;
            font-weight: 600;
            margin: 0;
        }

        .btn-logout {
            background: none;
            border: none;
            color: #555;
            font-size: 14px;
            cursor: pointer;
        }

        .nav-tabs {
            border-bottom: 1px solid #ddd;
            margin-bottom: 20px;
        }

        .nav-tabs .nav-link {
            border: none;
            color: #555;
            font-weight: 500;
        }

        .nav-tabs .nav-link.active {
            border-bottom: 2px solid #000;
            color: #000;
        }

        .table {
            background-color: #fafafa;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
        }

        .table thead {
            background-color: #f5f5f5;
        }

        .table th, .table td {
            vertical-align: middle;
            font-size: 14px;
            padding: 12px;
        }

        .table tbody tr:hover {
            background-color: #f0f0f0;
        }

        .btn-action {
            border: none;
            background: none;
            cursor: pointer;
            color: #0095f6;
            font-size: 14px;
            margin-right: 10px;
        }

        .btn-action.delete {
            color: #e63946;
        }

        .modal-content {
            border-radius: 10px;
        }
    </style>
</head>
<body>
<div class="container">

    <!-- Заголовок -->
    <div class="admin-header">
        <h2>Админ-панель</h2>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn-logout">Выйти</button>
        </form>
    </div>

    <!-- Навигация -->
    <ul class="nav nav-tabs">
        <li class="nav-item">
            <a class="nav-link active" href="#">Пользователи</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="/user">Профиль</a>
        </li>
    </ul>

    <!-- Управление -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <span class="fw-bold">Список пользователей</span>
        <button type="button" class="btn btn-primary btn-sm" id="newUserButton">+ Новый пользователь</button>
    </div>

    <!-- Таблица -->
    <div class="table-responsive">
        <table class="table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Имя пользователя</th>
                <th>Email</th>
                <th>Роль</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody class="users-table"><!-- подгружаем JS --></tbody>
        </table>
    </div>
</div>

<!-- Модальные окна -->
<div class="modal fade" id="editUserModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content p-3">
            <h5 class="mb-3">Редактировать пользователя</h5>
            <form>
                <div class="mb-3">
                    <label class="form-label">Имя пользователя</label>
                    <input type="text" class="form-control" id="editUserName">
                </div>
                <div class="mb-3">
                    <label class="form-label">Пароль</label>
                    <input type="password" class="form-control" id="editUserPassword" placeholder="Новый пароль">
                </div>
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="editUserIsAdmin">
                    <label class="form-check-label" for="editUserIsAdmin">Админ</label>
                </div>
                <div class="d-flex justify-content-end">
                    <button type="button" class="btn btn-secondary me-2" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-primary" id="saveEditButton">Сохранить</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="deleteUserModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content p-3">
            <h5 class="mb-3">Удалить пользователя</h5>
            <p>Вы уверены, что хотите удалить <strong id="deleteUserName"></strong>?</p>
            <div class="d-flex justify-content-end">
                <button type="button" class="btn btn-secondary me-2" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteButton">Удалить</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="newUserModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content p-3">
            <h5 class="mb-3">Создать пользователя</h5>
            <form>
                <div class="mb-3">
                    <label class="form-label">Имя пользователя</label>
                    <input type="text" class="form-control" id="newUserName">
                </div>
                <div class="mb-3">
                    <label class="form-label">Пароль</label>
                    <input type="password" class="form-control" id="newUserPassword">
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" id="newUserEmail">
                </div>
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="newUserIsAdmin">
                    <label class="form-check-label" for="newUserIsAdmin">Админ</label>
                </div>
                <div class="d-flex justify-content-end">
                    <button type="button" class="btn btn-secondary me-2" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-primary" id="createNewUserButton">Создать</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/admin.js"></script>
</body>
</html>
