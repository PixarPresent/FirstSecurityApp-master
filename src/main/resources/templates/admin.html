<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --danger-gradient: linear-gradient(135deg, #f5576c 0%, #f093fb 100%);
            --dark-bg: #1a1d29;
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            --card-hover-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        [data-theme="dark"] {
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            --card-hover-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
        }

        * {
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        [data-theme="dark"] body {
            background: linear-gradient(135deg, #1a1d29 0%, #2d3142 100%);
            color: #e0e0e0;
        }

        .navbar-modern {
            background: var(--danger-gradient) !important;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            padding: 1.2rem 0;
        }

        .user-info-header {
            color: white;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .role-badge {
            display: inline-block;
            padding: 0.35rem 0.85rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            margin-left: 0.5rem;
        }

        .sidebar {
            background: white;
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: var(--card-shadow);
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        [data-theme="dark"] .sidebar {
            background: #2d3142;
            color: #e0e0e0;
        }

        .sidebar .nav-link {
            padding: 0.75rem 1.25rem;
            margin-bottom: 0.5rem;
            border-radius: 10px;
            color: #495057;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        [data-theme="dark"] .sidebar .nav-link {
            color: #b0b0b0;
        }

        .sidebar .nav-link:hover {
            background: var(--danger-gradient);
            color: white;
            transform: translateX(5px);
        }

        .sidebar .nav-link.active {
            background: var(--danger-gradient);
            color: white;
        }

        .main-content {
            background: white;
            border-radius: 15px;
            padding: 2.5rem;
            box-shadow: var(--card-shadow);
            margin-bottom: 2rem;
        }

        [data-theme="dark"] .main-content {
            background: #2d3142;
            color: #e0e0e0;
        }

        .page-title {
            font-size: 2.5rem;
            font-weight: 700;
            background: var(--danger-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 2rem;
        }

        .btn-modern {
            border-radius: 10px;
            padding: 0.6rem 1.5rem;
            font-weight: 600;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-logout {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
        }

        .btn-logout:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.5);
            color: white;
        }

        .btn-new-user {
            background: var(--primary-gradient);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            font-weight: 600;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-new-user:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
            color: white;
        }

        .table-modern {
            background: white !important;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        [data-theme="dark"] .table-modern {
            background: #2d3142 !important;
            color: #e0e0e0 !important;
        }

        .table-modern thead {
            background: var(--primary-gradient) !important;
            color: white !important;
        }

        .table-modern thead th {
            background: var(--primary-gradient) !important;
            color: white !important;
            border-color: rgba(255, 255, 255, 0.2) !important;
        }

        .table-modern tbody {
            background: white;
        }

        [data-theme="dark"] .table-modern tbody {
            background: #2d3142 !important;
        }

        .table-modern tbody tr {
            transition: all 0.3s ease;
            background: white;
        }

        [data-theme="dark"] .table-modern tbody tr {
            background: #2d3142 !important;
            color: #e0e0e0 !important;
        }

        .table-modern tbody tr:hover {
            background: rgba(102, 126, 234, 0.1) !important;
            transform: scale(1.01);
        }

        [data-theme="dark"] .table-modern tbody tr:hover {
            background: rgba(102, 126, 234, 0.3) !important;
        }

        [data-theme="dark"] .table-modern tbody tr:nth-child(even) {
            background: rgba(45, 49, 66, 0.7) !important;
        }

        [data-theme="dark"] .table-modern tbody tr:nth-child(even):hover {
            background: rgba(102, 126, 234, 0.35) !important;
        }

        [data-theme="dark"] .badge {
            color: white !important;
        }

        .table-modern td, .table-modern th {
            padding: 1.25rem;
            vertical-align: middle;
            border-color: rgba(0, 0, 0, 0.1);
        }

        .table-modern td {
            background: inherit;
            color: inherit;
        }

        [data-theme="dark"] .table-modern td {
            background: inherit !important;
            color: #e0e0e0 !important;
            border-color: rgba(255, 255, 255, 0.1) !important;
        }

        [data-theme="dark"] .table-modern td strong {
            color: #e0e0e0 !important;
        }

        [data-theme="dark"] .table-modern th {
            color: white !important;
            border-color: rgba(255, 255, 255, 0.2) !important;
        }

        [data-theme="dark"] .table-modern {
            border-color: rgba(255, 255, 255, 0.1) !important;
        }

        [data-theme="dark"] .table-modern tbody tr {
            border-color: rgba(255, 255, 255, 0.1) !important;
        }

        /* Переопределение Bootstrap стилей для таблицы */
        [data-theme="dark"] .table-modern.table {
            --bs-table-bg: #2d3142 !important;
            --bs-table-color: #e0e0e0 !important;
            --bs-table-border-color: rgba(255, 255, 255, 0.1) !important;
            color: #e0e0e0 !important;
        }

        [data-theme="dark"] .table-modern.table > :not(caption) > * > * {
            background-color: transparent !important;
            color: #e0e0e0 !important;
            border-color: rgba(255, 255, 255, 0.1) !important;
        }

        [data-theme="dark"] .table-modern.table > tbody > tr > td,
        [data-theme="dark"] .table-modern.table > tbody > tr > th {
            background-color: inherit !important;
            color: #e0e0e0 !important;
        }

        [data-theme="dark"] .table-modern .action-buttons {
            color: inherit;
        }

        .btn-action {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 500;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-edit {
            background: var(--primary-gradient);
            color: white;
        }

        .btn-edit:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
            color: white;
        }

        .btn-delete {
            background: var(--danger-gradient);
            color: white;
        }

        .btn-delete:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(245, 87, 108, 0.4);
            color: white;
        }

        .modal-content {
            border-radius: 15px;
            border: none;
        }

        [data-theme="dark"] .modal-content {
            background: #2d3142;
            color: #e0e0e0;
        }

        [data-theme="dark"] .modal-header {
            border-bottom: 1px solid #3d4152;
        }

        [data-theme="dark"] .modal-footer {
            border-top: 1px solid #3d4152;
        }

        [data-theme="dark"] .form-control {
            background: #3d4152;
            border-color: #4d5162;
            color: #e0e0e0;
        }

        [data-theme="dark"] .form-control:focus {
            background: #3d4152;
            border-color: #667eea;
            color: #e0e0e0;
        }

        [data-theme="dark"] .form-label {
            color: #b0b0b0;
        }

        .theme-toggle {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-left: 1rem;
        }

        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        .theme-toggle i {
            font-size: 1.3rem;
        }

        .action-buttons {
            display: flex;
            gap: 0.5rem;
        }

        @media (max-width: 768px) {
            .sidebar {
                margin-bottom: 2rem;
                position: relative;
                top: 0;
            }

            .page-title {
                font-size: 2rem;
            }

            .main-content {
                padding: 1.5rem;
            }

            .table-modern {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <!-- Modern Navbar -->
    <nav class="navbar navbar-modern">
        <div class="container-fluid px-4">
            <div class="d-flex align-items-center">
                <i class="bi bi-shield-lock text-white me-2" style="font-size: 1.8rem;"></i>
                <div class="user-info-header">
                    <span id="userEmail"><!-- подгружаем JS --></span>
                    <span class="role-badge" id="userRoles"><!-- подгружаем JS --></span>
                </div>
            </div>
            <div class="d-flex align-items-center gap-3">
                <button id="themeToggle" class="theme-toggle" onclick="toggleTheme()" title="Switch to Dark Mode">
                    <i class="bi bi-moon-fill"></i>
                </button>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-logout btn-modern">
                        <i class="bi bi-box-arrow-right me-2"></i>Logout
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 py-4">
        <div class="row">
            <!-- Sidebar Navigation -->
            <div class="col-lg-3 col-md-4 mb-4">
                <div class="sidebar">
                    <div class="d-flex flex-column">
                        <a href="/user" class="nav-link">
                            <i class="bi bi-house-door"></i>
                            <span>Home</span>
                        </a>
                        <a th:if="${#authorization.expression('hasRole(''ADMIN'')')}"
                           href="/admin" class="nav-link active">
                            <i class="bi bi-shield-lock"></i>
                            <span>Admin Panel</span>
                        </a>
                    </div>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-lg-9 col-md-8">
                <div class="main-content">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h1 class="page-title mb-0">
                            <i class="bi bi-people me-2"></i>Admin Panel
                        </h1>
                        <button type="button" class="btn btn-new-user" id="newUserButton">
                            <i class="bi bi-person-plus me-2"></i>New User
                        </button>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-modern">
                            <thead>
                            <tr>
                                <th scope="col">ID</th>
                                <th scope="col">Username</th>
                                <th scope="col">Email</th>
                                <th scope="col">Role</th>
                                <th scope="col" class="text-center">Actions</th>
                            </tr>
                            </thead>
                            <tbody class="users-table">
                            <!-- подгружаем JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- окно удаления -->
    <div class="modal fade" id="deleteUserModal" tabindex="-1" aria-labelledby="deleteUserModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="deleteUserModalLabel">
                        <i class="bi bi-exclamation-triangle me-2 text-danger"></i>Delete User
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>Are you sure you want to delete this user?</p>
                    <p><strong>Username:</strong> <span id="deleteUserName"></span></p>
                    <p><strong>Email:</strong> <span id="deleteUserEmail"></span></p>
                    <p><strong>Roles:</strong> <span id="deleteUserRoles"></span></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger btn-action btn-delete" id="confirmDeleteButton">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <!-- окно редактирования -->
    <div class="modal fade" id="editUserModal" tabindex="-1" aria-labelledby="editUserModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editUserModalLabel">
                        <i class="bi bi-pencil-square me-2"></i>Edit User
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="mb-3">
                            <label for="editUserName" class="form-label">Username</label>
                            <input type="text" class="form-control" id="editUserName">
                        </div>
                        <div class="mb-3">
                            <label for="editUserPassword" class="form-label">Password</label>
                            <input type="password" class="form-control" id="editUserPassword" placeholder="Enter new password">
                        </div>
                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="editUserIsAdmin">
                                <label class="form-check-label" for="editUserIsAdmin">Admin</label>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary btn-action btn-edit" id="saveEditButton">Save changes</button>
                </div>
            </div>
        </div>
    </div>

    <!--окно создания пользователя -->
    <div class="modal fade" id="newUserModal" tabindex="-1" aria-labelledby="newUserModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="newUserModalLabel">
                        <i class="bi bi-person-plus me-2"></i>New User
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="mb-3">
                            <label for="newUserName" class="form-label">Username</label>
                            <input type="text" class="form-control" id="newUserName">
                        </div>
                        <div class="mb-3">
                            <label for="newUserPassword" class="form-label">Password</label>
                            <input type="password" class="form-control" id="newUserPassword">
                        </div>
                        <div class="mb-3">
                            <label for="newUserEmail" class="form-label">Email</label>
                            <input type="email" class="form-control" id="newUserEmail">
                        </div>
                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="newUserIsAdmin">
                                <label class="form-check-label" for="newUserIsAdmin">Admin</label>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary btn-action btn-edit" id="createNewUserButton">Create</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
            crossorigin="anonymous"></script>
    <script src="/theme.js"></script>
    <script src="/admin.js"></script>
</body>
</html>
