<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org" lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>User Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/x-theme.css">
    <link rel="stylesheet" href="/post-feed.css">
    <style>
        .navbar-modern {
            background: var(--x-bg) !important;
            border-bottom: 1px solid var(--x-border);
            box-shadow: none;
            padding: 0.75rem 1rem;
        }

        .navbar-modern .navbar-brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: white !important;
            letter-spacing: 0.5px;
        }

        .user-info-header {
            color: var(--x-text);
            display: flex;
            align-items: center;
            gap: var(--x-space-2);
        }

        .user-info-header i {
            font-size: 1.2rem;
        }

        .role-badge {
            display: inline-block;
            padding: 0.15rem 0.6rem;
            border-radius: var(--x-radius-full);
            font-size: 0.8rem;
            font-weight: 700;
            background: var(--x-primary-soft);
            color: var(--x-primary);
            margin-left: var(--x-space-2);
        }

        .sidebar {
            background: transparent;
            border-radius: 0;
            padding: 0;
            box-shadow: none;
        }

        .left-sidebar-col {
            position: sticky;
            top: 72px; /* примерно высота навбара */
            align-self: flex-start;
            height: calc(100vh - 72px);
        }

        .sidebar .nav-link {
            padding: 0.75rem 0.9rem;
            margin-bottom: 0.35rem;
            border-radius: var(--x-radius-full);
            color: var(--x-text);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .sidebar .nav-link i {
            font-size: 1.35rem;
        }

        .sidebar .nav-link:hover {
            background: var(--x-hover);
            color: var(--x-primary);
            transform: none;
        }

        .sidebar .nav-link.active {
            background: var(--x-primary);
            color: #ffffff;
        }

        .main-content {
            background: transparent;
            border-radius: 0;
            padding: 0;
            box-shadow: none;
            margin-bottom: 0;
        }

        .page-title {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--x-text);
            margin-bottom: 1rem;
        }

        .info-card {
            background: transparent;
            border: none;
            border-radius: 0;
            padding: 0.75rem 0;
            margin-bottom: 0.5rem;
            box-shadow: none;
            border-bottom: 1px solid var(--x-border);
        }

        .info-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--x-text-subtle);
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        [data-theme="dark"] .info-label {
            color: #9ca3af;
        }

        .info-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--x-text);
        }

        .info-value.role {
            display: inline-block;
            padding: 0.25rem 0.9rem;
            background: var(--x-primary-soft);
            color: var(--x-primary);
            border-radius: var(--x-radius-full);
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }

        .btn-modern {
            border-radius: var(--x-radius-full);
            padding: 0.45rem 1.1rem;
            font-weight: 700;
            border: 1px solid transparent;
            font-size: 0.9rem;
        }

        .btn-logout {
            background: var(--x-primary);
            color: #ffffff;
            box-shadow: none;
        }

        .btn-logout:hover {
            background: var(--x-primary-hover);
            color: #ffffff;
            transform: none;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .stat-item {
            text-align: center;
            padding: 1rem;
            background: transparent;
            border-radius: var(--x-radius-md);
            box-shadow: none;
            border: 1px solid var(--x-border);
            color: var(--x-text);
        }

        .theme-toggle {
            background: transparent;
            border: 1px solid var(--x-border);
            color: var(--x-text);
            width: 40px;
            height: 40px;
            border-radius: var(--x-radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-left: 1rem;
        }

        .theme-toggle:hover {
            background: var(--x-hover);
            transform: none;
        }

        .theme-toggle i {
            font-size: 1.3rem;
        }

        .stat-icon {
            font-size: 1.8rem;
            color: var(--x-primary);
            margin-bottom: 0.5rem;
        }

        .right-sidebar {
            position: sticky;
            top: 72px; /* ниже навбара */
        }

        @media (max-width: 768px) {
            .sidebar {
                margin-bottom: 2rem;
                position: relative;
                top: 0;
            }

            .page-title {
                font-size: 2rem;
            }

            .main-content {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Modern Navbar -->
    <nav class="navbar navbar-modern">
        <div class="container-fluid px-4">
            <div class="d-flex align-items-center">
                <i class="bi bi-person-circle text-white me-2" style="font-size: 1.8rem;"></i>
                <div class="user-info-header">
                    <span id="userEmail"><!-- подгружаем js --></span>
                    <span class="role-badge" id="userRoles"><!-- подгружаем js --></span>
                </div>
            </div>
            <div class="d-flex align-items-center gap-3">
                <button id="themeToggle" class="theme-toggle" onclick="toggleTheme()" title="Switch to Dark Mode">
                    <i class="bi bi-moon-fill"></i>
                </button>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-logout btn-modern">
                        <i class="bi bi-box-arrow-right me-2"></i>Logout
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 py-4">
        <div class="row justify-content-center" style="max-width: 1320px; margin: 0 auto;">
            <!-- Left Navigation (fixed like Twitter sidebar) -->
            <div class="col-xl-3 col-lg-3 d-none d-lg-block left-sidebar-col">
                <div class="sidebar">
                    <div class="d-flex flex-column">
                        <a href="/user" class="nav-link active">
                            <i class="bi bi-house-door"></i>
                            <span>Home</span>
                        </a>
                        <a th:if="${user.roles.?[name == 'ROLE_ADMIN'].size() > 0}"
                           href="/admin" class="nav-link">
                            <i class="bi bi-shield-lock"></i>
                            <span>Admin Panel</span>
                        </a>
                    </div>
                </div>
            </div>

            <!-- Center Column: main feed -->
            <div class="col-xl-6 col-lg-8 col-md-12">
                <div class="main-content">
                    <h1 class="page-title">
                        <i class="bi bi-person-badge me-2"></i>User Dashboard
                    </h1>

                    <!-- Post Feed Section (без верхнего блока News Feed) -->
                    <div class="post-feed-container">
                        <!-- Create Post Section -->
                        <div class="create-post-card">
                            <h5 class="mb-3">
                                <i class="bi bi-pencil-square me-2"></i>Create a Post
                            </h5>
                            <textarea
                                id="createPostTextarea"
                                class="create-post-textarea"
                                placeholder="What's on your mind?"
                                maxlength="1000"></textarea>

                            <!-- File Upload Section -->
                            <div class="file-upload-section">
                                <input type="file" id="fileInput" class="file-input" multiple accept="image/*">
                                <label for="fileInput" class="file-input-label">
                                    <i class="bi bi-image me-2"></i>Add Photos
                                </label>
                            </div>

                            <!-- File Preview -->
                            <div id="filePreview" class="file-preview"></div>

                            <div class="create-post-actions">
                                <span id="charCounter" class="char-counter">0/1000</span>
                                <button id="createPostBtn" class="btn-create-post" disabled>
                                    <i class="bi bi-send me-2"></i>Post
                                </button>
                            </div>
                        </div>

                        <!-- Posts Container -->
                        <div id="postsContainer">
                            <!-- Posts will be loaded here dynamically -->
                            <div class="loading-spinner">
                                <i class="bi bi-arrow-clockwise"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column: user info & stats (fixed like Twitter widgets) -->
            <div class="col-xl-3 d-none d-xl-block">
                <aside class="right-sidebar">
                    <h5 class="mb-3">Your profile</h5>

                    <!-- User Information Cards (JS will fill this) -->
                    <div id="userInfoCards">
                        <!-- подгружаем js -->
                    </div>
                </aside>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
            crossorigin="anonymous"></script>
    <script src="/theme.js"></script>
    <script src="/user.js"></script>
    <script src="/post-feed.js"></script>
</body>
</html>
