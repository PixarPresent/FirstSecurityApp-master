<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org" lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>User Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            --secondary-gradient: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
            --dark-bg: #1a1d29;
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            --card-hover-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        [data-theme="dark"] {
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            --card-hover-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
        }

        * {
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        [data-theme="dark"] body {
            background: linear-gradient(135deg, #1a1d29 0%, #2d3142 100%);
            color: #e0e0e0;
        }

        .navbar-modern {
            background: var(--primary-gradient) !important;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            padding: 1.2rem 0;
        }

        .navbar-modern .navbar-brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: white !important;
            letter-spacing: 0.5px;
        }

        .sidebar {
            background: white;
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: var(--card-shadow);
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        [data-theme="dark"] .sidebar {
            background: #2d3142;
            color: #e0e0e0;
        }

        .sidebar .nav-link {
            padding: 0.75rem 1.25rem;
            margin-bottom: 0.5rem;
            border-radius: 10px;
            color: #495057;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transition: all 0.3s ease;
        }

        [data-theme="dark"] .sidebar .nav-link {
            color: #b0b0b0;
        }

        .sidebar .nav-link:hover {
            background: var(--primary-gradient);
            color: white;
            transform: translateX(5px);
        }

        .sidebar .nav-link.active {
            background: var(--primary-gradient);
            color: white;
        }

        .sidebar .nav-link i {
            font-size: 1.1rem;
        }

        .main-content {
            background: white;
            border-radius: 15px;
            padding: 2.5rem;
            box-shadow: var(--card-shadow);
            margin-bottom: 2rem;
        }

        [data-theme="dark"] .main-content {
            background: #2d3142;
            color: #e0e0e0;
        }

        .page-title {
            font-size: 2.5rem;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 2rem;
        }

        .info-card {
            background: linear-gradient(135deg, #3b82f615 0%, #1d4ed815 100%);
            border: none;
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
        }

        [data-theme="dark"] .info-card {
            background: linear-gradient(135deg, #3b82f625 0%, #1d4ed825 100%);
        }

        .info-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--card-hover-shadow);
        }

        .info-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #6c757d;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        [data-theme="dark"] .info-label {
            color: #9ca3af;
        }

        .info-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #212529;
        }

        [data-theme="dark"] .info-value {
            color: #e0e0e0;
        }

        .info-value.role {
            display: inline-block;
            padding: 0.5rem 1.25rem;
            background: var(--primary-gradient);
            color: white;
            border-radius: 25px;
            font-size: 1rem;
            margin-top: 0.5rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .stat-item {
            text-align: center;
            padding: 1.5rem;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        [data-theme="dark"] .stat-item {
            background: #2d3142;
            color: #e0e0e0;
        }

        .bottom-controls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: calc(25% - 40px);
            max-width: 300px;
            display: flex;
            gap: 0.5rem;
            z-index: 1000;
        }

        .bottom-btn {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            border: none;
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            font-weight: 500;
            color: #495057;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            z-index: 1000;
        }

        .bottom-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        [data-theme="dark"] .bottom-btn {
            background: rgba(45, 49, 66, 0.95);
            color: #e0e0e0;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        [data-theme="dark"] .bottom-btn:hover {
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
        }

        .bottom-btn.user {
            flex: 2;
            padding: 0.75rem 0.75rem;
            background: linear-gradient(135deg, #3b82f615 0%, #1d4ed815 100%);
            color: #3b82f6;
            justify-content: flex-start;
        }

        .bottom-btn.user:hover {
            background: linear-gradient(135deg, #3b82f625 0%, #1d4ed825 100%);
        }

        [data-theme="dark"] .bottom-btn.user {
            background: linear-gradient(135deg, #3b82f625 0%, #1d4ed825 100%);
            color: #93c5fd;
        }

        [data-theme="dark"] .bottom-btn.user:hover {
            background: linear-gradient(135deg, #3b82f635 0%, #1d4ed835 100%);
        }

        .bottom-btn.theme {
            flex: 1;
            padding: 0.5rem 0.5rem;
            font-size: 0.8rem;
            background: linear-gradient(135deg, #06b6d415 0%, #0891b215 100%);
            color: #06b6d4;
            justify-content: center;
        }

        .bottom-btn.theme:hover {
            background: linear-gradient(135deg, #06b6d425 0%, #0891b225 100%);
        }

        [data-theme="dark"] .bottom-btn.theme {
            background: linear-gradient(135deg, #06b6d425 0%, #0891b225 100%);
            color: #67e8f9;
        }

        [data-theme="dark"] .bottom-btn.theme:hover {
            background: linear-gradient(135deg, #06b6d435 0%, #0891b235 100%);
        }

        .bottom-btn.logout {
            flex: 1;
            padding: 0.5rem 0.5rem;
            font-size: 0.8rem;
            background: linear-gradient(135deg, #f5576c15 0%, #ef444415 100%);
            color: #f5576c;
            justify-content: center;
        }

        .bottom-btn.logout:hover {
            background: linear-gradient(135deg, #f5576c25 0%, #ef444425 100%);
        }

        [data-theme="dark"] .bottom-btn.logout {
            background: linear-gradient(135deg, #f5576c25 0%, #ef444425 100%);
            color: #fca5a5;
        }

        [data-theme="dark"] .bottom-btn.logout:hover {
            background: linear-gradient(135deg, #f5576c35 0%, #ef444435 100%);
        }

        .bottom-btn i {
            font-size: 1.1rem;
        }

        .bottom-btn .user-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.1rem;
        }

        .bottom-btn .user-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.8;
        }

        .bottom-btn .user-email {
            font-size: 0.85rem;
            font-weight: 600;
        }

        .stat-icon {
            font-size: 2.5rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        @media (max-width: 768px) {
            .sidebar {
                margin-bottom: 2rem;
                position: relative;
                top: 0;
            }

            .page-title {
                font-size: 2rem;
            }

            .main-content {
                padding: 1.5rem;
            }

            .bottom-bar {
                flex-direction: column;
                gap: 1rem;
                align-items: stretch;
                left: 10px;
                right: 10px;
                bottom: 10px;
            }

            .user-info {
                justify-content: center;
            }

            .controls {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <!-- Modern Navbar -->
    <nav class="navbar navbar-modern">
        <div class="container-fluid px-4">
            <div class="d-flex align-items-center">
                <div class="navbar-brand">
                    <i class="bi bi-shield-check me-2"></i>Security App
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 py-4">
        <div class="row">
            <!-- Sidebar Navigation -->
            <div class="col-lg-3 col-md-4 mb-4">
                <div class="sidebar">
                    <div class="d-flex flex-column">
                        <a href="/user" class="nav-link active">
                            <i class="bi bi-house-door"></i>
                            <span>Home</span>
                        </a>
                        <a th:if="${user.roles.?[name == 'ROLE_ADMIN'].size() > 0}"
                           href="/admin" class="nav-link">
                            <i class="bi bi-shield-lock"></i>
                            <span>Admin Panel</span>
                        </a>
                    </div>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-lg-9 col-md-8">
                <div class="main-content">
                    <h1 class="page-title">
                        <i class="bi bi-person-badge me-2"></i>User Dashboard
                    </h1>

                    <!-- User Information Cards -->
                    <div class="row" id="userInfoCards">
                        <!-- подгружаем js -->
                    </div>

                    <!-- Stats Grid -->
                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-icon">
                                <i class="bi bi-person-check"></i>
                            </div>
                            <div class="info-label">Status</div>
                            <div class="info-value" style="font-size: 1rem; color: #28a745;">
                                <i class="bi bi-check-circle me-1"></i>Active
                            </div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-icon">
                                <i class="bi bi-shield-check"></i>
                            </div>
                            <div class="info-label">Security</div>
                            <div class="info-value" style="font-size: 1rem; color: #17a2b8;">
                                <i class="bi bi-lock me-1"></i>Protected
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Controls -->
    <div class="bottom-controls">
        <button class="bottom-btn user" title="User Information">
            <i class="bi bi-shield-check"></i>
            <div class="user-info">
                <span class="user-label">User</span>
                <span class="user-email" id="userEmailBottom"><!-- подгружаем js --></span>
            </div>
        </button>
        
        <button id="themeToggle" class="bottom-btn theme" onclick="toggleTheme()" title="Switch Theme">
            <i class="bi bi-moon-fill"></i>
        </button>
        
        <form th:action="@{/logout}" method="post" style="display: contents;">
            <button type="submit" class="bottom-btn logout" title="Logout">
                <i class="bi bi-box-arrow-right"></i>
            </button>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
            crossorigin="anonymous"></script>
    <script src="/theme.js"></script>
    <script src="/user.js"></script>
</body>
</html>
