<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Профиль пользователя</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            background-color: #fff;
            color: #222;
            font-family: 'Arial', sans-serif;
        }

        .profile-header {
            display: flex;
            align-items: center;
            padding: 30px 0;
            border-bottom: 1px solid #ddd;
            margin-bottom: 20px;
        }

        .profile-avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background-color: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
            color: #666;
            flex-shrink: 0;
        }

        .profile-info {
            margin-left: 40px;
            flex: 1;
        }

        .profile-info h2 {
            font-size: 24px;
            font-weight: 600;
            margin: 0;
        }

        .profile-info p {
            margin: 5px 0 15px;
            color: #555;
        }

        .stats {
            display: flex;
            gap: 30px;
            margin-bottom: 10px;
        }

        .stats div {
            font-size: 14px;
        }

        .btn-follow {
            background-color: #0095f6;
            border: none;
            color: white;
            font-weight: 600;
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-logout {
            background: none;
            border: none;
            color: #555;
            margin-left: 15px;
            cursor: pointer;
        }

        .nav-tabs {
            border-bottom: 1px solid #ddd;
            margin-bottom: 20px;
        }

        .nav-tabs .nav-link {
            border: none;
            color: #555;
            font-weight: 500;
        }

        .nav-tabs .nav-link.active {
            border-bottom: 2px solid #000;
            color: #000;
        }

        .posts-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .posts-grid div {
            background-color: #eee;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aaa;
            font-size: 18px;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Профиль -->
    <div class="profile-header">
        <div class="profile-avatar" aria-label="Аватар">
            <span id="userInitials">U</span>
        </div>
        <div class="profile-info">
            <h2 id="userEmail">user@example.com</h2>
            <p id="userRoles">Traveller | Photographer</p>
            <div class="stats">
                <div><strong>120</strong> публикаций</div>
                <div><strong>540</strong> подписчиков</div>
                <div><strong>180</strong> подписки</div>
            </div>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="button" class="btn-follow">Подписаться</button>
                <button type="submit" class="btn-logout">Выйти</button>
            </form>
        </div>
    </div>

    <!-- Навигация -->
    <ul class="nav nav-tabs">
        <li class="nav-item">
            <a class="nav-link active" href="#">Публикации</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="#">Reels</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="#">Отметки</a>
        </li>
        <li class="nav-item" th:if="${user.roles.?[name == 'ROLE_ADMIN'].size() > 0}">
            <a class="nav-link" href="/admin">Админ</a>
        </li>
    </ul>


    <!-- Сетка постов -->
    <div class="posts-grid">
        <div>Фото 1</div>
        <div>Фото 2</div>
        <div>Фото 3</div>
        <div>Фото 4</div>
        <div>Фото 5</div>
        <div>Фото 6</div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="/user.js"></script>
</body>
</html>
